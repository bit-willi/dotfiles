// Keep comprehensive fingerprinting protection while allowing websites to
// follow the operating system's light/dark color scheme.
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref(
  "privacy.fingerprintingProtection.overrides",
  "+AllTargets,-CSSPrefersColorScheme"
);

// Hide the browser toolbar while a page is in fullscreen mode.
defaultPref("browser.fullscreen.autohide", true);
