# AC-primary workstation profile.
#
# Overrides ship here rather than in /etc/tlp.conf so pacman never prompts
# about a modified config file on tlp upgrades.

TLP_DEFAULT_MODE=AC

# The machine lives on AC; give it the full frequency range there and only
# back off on battery.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced

# HDA power saving cuts the amp after a moment of silence, which the ALC269VC
# announces with an audible pop on the next sample.
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

# USB autosuspend drops the first fraction of a second on USB microphones.
# EXCLUDE_AUDIO covers any audio-class device (so a newly plugged interface is
# protected without editing this file); the denylist pins the known IDs.
#   3142:5060  Fifine microphone
#   1d6c:0103  Intelbras FHD WCI1080P webcam
#   2b7e:c705  Kingcome internal webcam
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_DENYLIST="3142:5060 1d6c:0103 2b7e:c705"
