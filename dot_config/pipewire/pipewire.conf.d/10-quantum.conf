# Replaces a full copy of upstream pipewire.conf that used to live at
# ~/.config/pipewire/pipewire.conf. A whole-file override shadows the packaged
# config and silently goes stale across upgrades; a drop-in only carries the
# deltas and inherits the rest.
#
# quantum 1024 @ 48 kHz is ~21ms, which leaves headroom for the EasyEffects
# chain without the latency of the 2048 the old file pinned.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 44100 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
}
